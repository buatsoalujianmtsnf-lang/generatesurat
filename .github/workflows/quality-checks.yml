name: Quality Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'fix/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Syntax, tests, and dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check JavaScript syntax and tests
        run: npm run check

      - name: Measure coverage for application, templates, and PDF API
        run: npm run test:coverage

      - name: Upload code coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generator-surat-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Audit production and development dependencies
        run: npm audit --audit-level=moderate

  mon07-redis:
    name: MON-07 real Redis state and receipt integration (isolated)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Execute real Redis Lua, atomic race and replay tests
        env:
          MON07_REDIS_INTEGRATION: "1"
        run: npm run test:mon07:redis

  mon07-browser:
    name: MON-07 isolated headless Chromium editor and sponsor modal UAT
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Headless Chromium desktop/mobile sponsor smoke
        run: npm run test:mon07:browser
      - name: Upload privacy-safe smoke screenshots and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mon07-browser-smoke
          path: artifacts/mon07-browser/
          if-no-files-found: warn
          retention-days: 14

  mon08-approval:
    name: MON-08 Google and sponsor approval dry-run (NO_GO)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Evaluate provider approval and safe rollout without activation
        run: node scripts/mon08-approval-gate.js --expect-blocked --write-report artifacts/mon08/approval-status.json
      - name: Archive non-sensitive release decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mon08-approval-no-go
          path: artifacts/mon08/approval-status.json
          if-no-files-found: warn
          retention-days: 14

  mon09-baseline:
    name: MON-09 monitoring readiness and report dry-run (NO_GO)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify monitoring disabled and MON-08 NO_GO
        run: npm run check:mon09
      - name: Produce honest non-live monitoring status
        run: |
          mkdir -p artifacts/mon09
          npm run report:mon09 --silent > artifacts/mon09/baseline.json
      - name: Upload sanitized monitoring readiness snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mon09-monitoring-not-active
          path: artifacts/mon09/baseline.json
          if-no-files-found: warn
          retention-days: 14

  pp04-browser:
    name: PP-04 isolated Chromium preview protection UAT
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify Preview Surat protection on desktop, tablet and mobile emulation
        run: npm run test:pp04:browser
      - name: Archive dummy-only screenshot, Chromium print and UAT summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pp04-preview-protection-uat
          path: artifacts/pp04-browser/
          if-no-files-found: warn
          retention-days: 14

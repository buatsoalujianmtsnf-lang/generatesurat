name: Quality Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'fix/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Syntax, tests, and dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check JavaScript syntax and tests
        run: npm run check

      - name: Measure coverage for application, templates, and PDF API
        run: npm run test:coverage

      - name: Upload code coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generator-surat-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Audit production and development dependencies
        run: npm audit --audit-level=moderate

  mon07-redis:
    name: MON-07 real Redis state and receipt integration (isolated)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Execute real Redis Lua, atomic race and replay tests
        env:
          MON07_REDIS_INTEGRATION: "1"
        run: npm run test:mon07:redis
